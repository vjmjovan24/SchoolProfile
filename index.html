<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMA St. Kristoforus 1</title>

<style>
/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

/* NAVBAR */
.navbar{
    background:#002E5B; /* warna utama */
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 45px;
}

.logo img{
    height:50px;
}

.menu a{
    color:white;
    text-decoration:none;
    margin-left:22px;
    font-weight:500;
    transition:0.3s;
}

.menu a:hover{
    color:#FFC20E;
}

/* HERO */
.hero{
    height:80vh;
    background:url("https://demix.co.id/wp-content/uploads/2025/11/Gereja-Kristoforus-Grogol-1.png") center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    position:relative;
}

.hero::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
}

.hero-content{
    position:relative;
}

.hero h1{
    font-size:50px;
    margin-bottom:8px;
}

.hero p{
    font-size:20px;
}

/* SECTION */
.section{
    padding:60px 80px;
    text-align:center;
}

.section h2{
    margin-bottom:20px;
    color:#002E5B;
}

.cards{
    display:flex;
    gap:18px;
    margin-top:30px;
}

.card{
    background:#f8f8f8;
    padding:22px;
    border-radius:8px;
    flex:1;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-4px);
}

/* FOOTER */
footer{
    background:#002E5B;
    color:white;
    text-align:center;
    padding:18px;
    margin-top:38px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <a href="#">
            <img src="https://kristo.sch.id/v2/wp-content/uploads/2020/07/HEADER-WEBSITE.png" alt="Logo SMA St. Kristoforus 1">
        </a>
    </div>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Profil</a>
        <a href="#">Akademik</a>
        <a href="#">Ekstrakurikuler</a>
        <a href="#">Kontak</a>
    </div>
</div>


<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <h1>Selamat Datang di SMA St. Kristoforus 1</h1>
        <p>Mendidik dengan Iman, Prestasi, dan Karakter</p>
    </div>
</section>


<!-- FOOTER -->
<footer>
    <p>© 2026 SMA St. Kristoforus 1 — All Rights Reserved</p>
</footer>

</body>
</html>
